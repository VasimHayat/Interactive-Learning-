# Used by the build when a module declares dependencies. Hibernate logs through
# jboss-logging, which falls back to java.util.logging here. Only warnings and
# above reach stderr; stdout (what the build diffs) is never touched.
handlers = java.util.logging.ConsoleHandler
.level = WARNING
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %4$s: %5$s%n
